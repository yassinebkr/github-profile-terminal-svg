<svg xmlns="http://www.w3.org/2000/svg" width="900" height="238" viewBox="0 0 900 238" role="img"><title>Debian terminal / Engineering OS</title><style>text{font-family:'DejaVu Sans Mono','Liberation Mono',Consolas,monospace}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1.1s steps(1) infinite}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}</style><rect x="0" y="0" width="900" height="238" fill="#0e1116" /><text x="30" y="31" fill="#6fd4dc" font-size="14" font-weight="400">CINEMAPI5 / R&amp;D PROTOTYPE</text><text x="30" y="56" fill="#9be5a7" font-size="14" font-weight="400">Platform       Raspberry Pi 5 + NVMe</text><text x="30" y="81" fill="#9be5a7" font-size="14" font-weight="400">Sensor         Sony IMX283</text><text x="30" y="106" fill="#9be5a7" font-size="14" font-weight="400">Imaging        RAW / Libcamera / PISP</text><text x="30" y="131" fill="#9be5a7" font-size="14" font-weight="400">UI             Responsive web / PWA</text><text x="30" y="156" fill="#9be5a7" font-size="14" font-weight="400">Integration    LUT / IMU / HUD</text><text x="30" y="181" fill="#f1c77e" font-size="14" font-weight="400">Target         4K 12-bit 30fps (performance goal)</text><text x="30" y="206" fill="#8592a1" font-size="14" font-weight="400">Code: github.com/yassinebkr/cinematepi5</text></svg>
