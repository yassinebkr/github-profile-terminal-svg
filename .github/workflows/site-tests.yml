name: Test ShellFolio interactive terminal

on:
  push:
    paths:
      - 'web/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/site-tests.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/site-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the virtual shell
        run: npm test
      - name: Validate browser scripts
        run: |
          node --check web/app.js
          node --check web/engine.js
      - name: Check application assets
        run: |
          test -s web/index.html
          test -s web/style.css
          test -s web/assets/debian.svg
