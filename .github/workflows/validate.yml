name: Validate terminal README

on:
  push:
    branches:
      - experiment/interactive-terminal
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/validate.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SVG XML and README references
        run: python3 scripts/validate.py
