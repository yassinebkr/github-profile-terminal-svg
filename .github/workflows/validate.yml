name: Validate animated profile SVG

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate profile art
        run: |
          python3 -m py_compile scripts/make_terminal.py scripts/validate.py
          python3 scripts/make_terminal.py
          python3 scripts/validate.py
      - name: Confirm reproducible output
        run: git diff --exit-code -- assets/terminal.svg
