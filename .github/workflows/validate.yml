name: Validate terminal README

on:
  push:
    branches:
      - experiment/interactive-terminal
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/make_terminal.py
      - scripts/validate.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check and regenerate SVGs
        # Run the documented generator on the CI runner, without committing.
        # This verifies the Python source as well as XML generation.
        run: |
          python3 -m py_compile scripts/make_terminal.py
          python3 scripts/make_terminal.py
      - name: Validate generated XML and README references
        run: python3 scripts/validate.py
